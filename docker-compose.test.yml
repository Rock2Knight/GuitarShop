version: '3.10'  # версия docker compose

services:   

  test_postgres:
    image: postgres:16                               # образ для постгреса 
    container_name: test_postgres_container               # имя контейнера
    environment:                                     # переменные окружения postgres
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      - PGDATA=/var/lib/postgresql/data/test_pgdata
    ports:
      - "5433:5432"                # По какому порту подключаться к postgres
    volumes:
      - ./test_pgdata:/var/lib/postgresql/data/test_pgdata  # каталог, в котором хранятся данные
    networks:
    - guitar_shop_network          # К какой сети подсоединяется
    command: >                     # команда для запуска БД в докере
      postgres -c max_connections=1000
               -c shared_buffers=256MB
               -c effective_cache_size=768MB
               -c maintenance_work_mem=64MB
               -c checkpoint_completion_target=0.7
               -c wal_buffers=16MB
               -c default_statistics_target=100
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ilshat_user -d test_db" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    tty: true
    stdin_open: true

  test_backend:
    container_name: test_backend  # имя контейнера
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "pytest -vv"
    ports:
      - "8000:8000"              # порты
    volumes:
      - .:/app                # место хранения данных под приложение
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:5432/${DB_NAME}  # URL для подключения к БД
    networks:
      - guitar_shop_network      # сеть, к которой подключается приложение
    #depends_on:                 # настройки зависимостей
    #  test_postgres:                           # зависит от сервиса test_postgres
    #    condition: service_healthy
    restart: unless-stopped
    tty: true                   # Принудительно открыть интерактивный вывод
    stdin_open: true            # Открыть STDIN

volumes:             # настройки томов
  pgdata:            
    driver: local    # Драйвер для тома pgdata

networks:                # настройки сетей
  guitar_shop_network:  
    driver: bridge       # драйвер для сети - мост